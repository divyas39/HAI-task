<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human or AI?</title>
<style>
  :root {
    --bg: #f5f6fa;  --card: #fff;      --ink: #15181f;  --muted: #5f6a7a;
    --line: #e4e8ef; --accent: #4356d6; --soft: #eceffd; --warn: #b4540a;
    --radius: 14px;
    /* one hue per answer, reused on the examples, the choice buttons and the AI panel */
    --human: #0d8c78;  --ai: #7350ab;
  }
  [data-e=Human] { --e: var(--human); }
  [data-e=AI]    { --e: var(--ai); }

  * { box-sizing: border-box; }
  body {
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink); margin: 0;
    padding: 0 1rem 4rem; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 42rem; margin: 0 auto; }
  h1 { font-size: 1.75rem; letter-spacing: -.025em; margin: 0 0 .5rem; }
  h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .09em;
       color: var(--muted); margin: 2.2rem 0 .8rem; }
  .lede { color: var(--muted); margin: 0 0 1.5rem; }
  p { margin: 0 0 .8rem; } p:last-child { margin-bottom: 0; }

  /* hero */
  .hero { margin: 0 -1rem 2.2rem; padding: 3.2rem 1rem 2.6rem;
          background: linear-gradient(150deg, #fdf6ec 0%, #fbf0e4 45%, var(--bg) 100%);
          border-bottom: 1px solid #efe4d6; }
  .hero > div { max-width: 42rem; margin: 0 auto; }
  .hero .lede { margin-bottom: 0; color: #5c5346; }
  .swatches { display: flex; gap: .4rem; margin-bottom: 1.3rem; }
  .swatches span { width: 2.1rem; height: .34rem; border-radius: 99px; background: var(--e); }

  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 1.4rem 1.5rem;
          box-shadow: 0 1px 2px rgba(16,24,40,.05); }
  .card + .card { margin-top: .9rem; }

  /* example cards, one per emotion */
  .ex { border-left: 4px solid var(--e); }
  .ex .pill { display: inline-block; font-size: .72rem; font-weight: 700;
              text-transform: uppercase; letter-spacing: .07em; color: var(--e);
              background: color-mix(in srgb, var(--e) 11%, #fff);
              border-radius: 99px; padding: .22rem .7rem; margin-bottom: .7rem; }
  .ex q { display: block; font-size: 1.08rem; line-height: 1.5; margin-bottom: .6rem;
          quotes: '"' '"'; }
  .ex .why { color: var(--muted); font-size: .93rem; margin: 0; }

  /* tweet + options */
  .tweet-text { font-size: 1.3rem; line-height: 1.5; letter-spacing: -.012em;
                margin: .2rem 0 1.5rem; padding-left: 1rem;
                border-left: 3px solid var(--accent); }
  .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr));
             gap: .5rem; }
  .opt { display: flex; align-items: center; gap: .55rem; cursor: pointer;
         border: 1px solid var(--line); border-radius: 10px; padding: .65rem .85rem;
         background: #fdfdfe; transition: border-color .12s, background .12s, color .12s; }
  .opt:hover { border-color: var(--e, #c3ccdb); }
  .opt:has(input:checked) { border-color: var(--e); color: var(--e); font-weight: 650;
         background: color-mix(in srgb, var(--e) 8%, #fff); }
  .opt input { accent-color: var(--e, var(--accent)); }
  .opt:has(input:focus-visible) { outline: 2px solid var(--e, var(--accent)); outline-offset: 2px; }
  input[type=radio], input[type=checkbox] { margin: 0; width: 1.05rem; height: 1.05rem;
         accent-color: var(--accent); }

  .ambiguous { display: flex; align-items: center; gap: .55rem; cursor: pointer;
               margin-top: 1.2rem; padding-top: 1.1rem; border-top: 1px dashed var(--line);
               color: var(--muted); font-size: .92rem; }
  .ambiguous:has(input:checked) { color: var(--warn); font-weight: 600; }
  .ambiguous input { accent-color: var(--warn); }

  /* progress */
  .progress { display: flex; align-items: center; gap: .8rem; margin: 2rem 0 1rem;
              font-size: .85rem; color: var(--muted); }
  .bar { flex: 1; height: 6px; background: #e1e5ee; border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px;
           background: linear-gradient(90deg, var(--accent), #7350ab);
           transition: width .28s ease; }

  /* controls */
  .row { display: flex; gap: .7rem; align-items: center; margin-top: 1.5rem; flex-wrap: wrap; }
  button, .btn { font: inherit; font-weight: 650; padding: .72rem 1.5rem; border: 0;
           border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer;
           text-decoration: none; box-shadow: 0 1px 2px rgba(67,86,214,.3); }
  .btn { display: inline-block; }
  [hidden] { display: none !important; }   /* keep the stepper's hidden buttons hidden */
  button:hover, .btn:hover { filter: brightness(1.09); }
  button[disabled] { background: #c8cedb; cursor: not-allowed; filter: none; box-shadow: none; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line);
           box-shadow: none; }
  button.ghost:hover { color: var(--ink); background: #edf0f6; filter: none; }
  input[type=text], textarea { font: inherit; padding: .7rem .85rem; width: 100%;
           border: 1px solid var(--line); border-radius: 10px; background: #fdfdfe; }
  input[type=text]:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0;
           border-color: transparent; }
  label.field { display: block; font-weight: 650; margin-bottom: .45rem; font-size: .95rem; }
  .hint { color: var(--muted); font-size: .88rem; }

  dl { margin: 0; } dl div { display: flex; gap: .8rem; padding: .38rem 0; align-items: baseline; }
  dt { font-weight: 650; min-width: 5.4rem; color: var(--e, var(--ink)); }
  dd { margin: 0; color: var(--muted); }
  ul.rules { margin: 0; padding-left: 1.15rem; } ul.rules li { margin: .35rem 0; }
  ul.rules b { color: var(--ink); }

  .err { background: #fdecec; border: 1px solid #f3c2c2; color: #96231f;
         border-radius: 10px; padding: .75rem 1rem; margin-bottom: 1rem; }
  footer { margin-top: 2.2rem; font-size: .85rem; color: var(--muted); text-align: center; }
  a { color: var(--accent); }
  .back { display: inline-block; margin-bottom: 1.4rem; font-size: .9rem;
          text-decoration: none; }

  dialog { border: 0; border-radius: var(--radius); padding: 1.5rem; max-width: 26rem;
           width: calc(100% - 2rem); box-shadow: 0 14px 44px rgba(16,24,40,.22); color: var(--ink); }
  dialog::backdrop { background: rgba(14,24,42,.5); }
  dialog h3 { margin: 0 0 .5rem; font-size: 1.15rem; }

  /* review card */
  .stars { color: #c8850d; letter-spacing: .12em; font-size: 1.05rem; margin-bottom: .6rem; }
  .stars span { color: #d6dbe4; }
  .review { font-size: 1.08rem; line-height: 1.6; margin: 0 0 1.4rem; padding-left: 1rem;
            border-left: 3px solid var(--accent); }
  .q { font-weight: 650; margin: 1.2rem 0 .55rem; }
  .q:first-child { margin-top: 0; }

  /* 1-5 scale: radios, so nobody is nudged by a pre-set slider value */
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: .4rem; }
  .scale label { text-align: center; border: 1px solid var(--line); border-radius: 10px;
                 padding: .5rem 0; cursor: pointer; background: #fdfdfe; }
  .scale label:has(input:checked) { border-color: var(--accent); background: var(--soft);
                 color: var(--accent); font-weight: 650; }
  .scale input { position: absolute; opacity: 0; }
  .scale label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ends { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted);
          margin-top: .3rem; }

  /* AI panel */
  .ai { border: 1px solid color-mix(in srgb, var(--e) 35%, #fff); border-radius: 12px;
        background: color-mix(in srgb, var(--e) 6%, #fff); padding: 1rem 1.1rem; margin: 1.2rem 0; }
  .ai .verdict { font-weight: 700; color: var(--e); }
  .meter { height: 8px; background: #e1e5ee; border-radius: 99px; overflow: hidden; margin: .5rem 0 .7rem; }
  .meter i { display: block; height: 100%; background: var(--e); }
  .locked { color: var(--muted); font-size: .92rem; }
</style>
</head>
<body>
{% block hero %}{% endblock %}
<main>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
{% block content %}{% endblock %}
<footer>{% block footer %}{% endblock %}</footer>
</main>
</body>
</html>
